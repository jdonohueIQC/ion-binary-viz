<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ion Detector Visualizer</title>
    style.css
</head>

<body>

<div id="wrapper">

    <canvas id="detector"></canvas>

    <div id="bits"></div>

    <div id="phrase"></div>

    <input id="textInput" type="text">

    <div class="controls">

        <button id="modeBtn">
            Letter Mode
        </button>

        <select id="soundScheme">
            <option>C Major Scale</option>
            <option>Space Laser Sounds</option>
            <option>ABC Song</option>
            <option>Smoke on the Water</option>
            <option>Oh Canada</option>
        </select>

        <label>
            Clarity
            <input
                type="range"
                id="clarity"
                min="0.5"
                max="5"
                step="0.1"
                value="1">
        </label>

        <label>
            Speed
            <input
                type="range"
                id="speed"
                min="0.2"
                max="5"
                step="0.1"
                value="3">
        </label>

        <button id="noiseBtn">
            Fluctuations On
        </button>

        <button id="muteBtn">
            Sound On
        </button>

        <button id="submitBtn">
            Submit
        </button>

    </div>

    <div id="status">
        Press a key to begin
    </div>

</div>

app.jsscript>

</body>
</html>
